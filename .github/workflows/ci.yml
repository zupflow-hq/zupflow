name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # The debug builds, the contract fixtures and the browser fill the
      # runner's disk; drop toolchains this job never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.96
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: pnpm install --frozen-lockfile
      # The development-only `local-apps` feature (reaching a fake app on
      # loopback) is opt-in: neither the product's tree, a plain build nor
      # any workspace crate by default may ever turn it on.
      - name: No development-only features in the product
        working-directory: server
        run: |
          for tree in "-p zupflow-server" "" "--workspace -i zupflow-outbound"; do
            if cargo tree $tree --locked -e features | grep -F local-apps; then
              echo "cargo tree $tree has the development-only local-apps feature" >&2
              exit 1
            fi
          done
      - run: pnpm check
      # The shared contract suite against the backend, on a fixture of its own.
      - run: pnpm contract:backend
      # Real hosted Connect JavaScript against disposable local fixtures.
      # The runner emits only safe case names and statuses; no browser artifacts.
      - run: pnpm --filter @zupflow/contract-tests exec playwright install --with-deps chromium
      - run: pnpm test:browser

  # The product builds for release, without the development-only crates. A
  # job of its own: next to the debug build it runs the runner out of disk.
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          key: release
      - run: cargo build --release --locked -p zupflow-server
        working-directory: server
      # A deployment with its own stores builds without default features,
      # so without `ZUPFLOW_IDENTITY=local`: that build must keep compiling.
      - run: cargo clippy --locked -p zupflow-server --no-default-features --all-targets -- -D warnings
        working-directory: server
