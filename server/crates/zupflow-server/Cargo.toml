[package]
name = "zupflow-server"
description = "The Zupflow API server."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "zupflow"
path = "src/main.rs"
required-features = ["sqlite"]

# The `zupflow` binary stores everything in SQLite. A deployment that supplies
# its own stores depends on this crate without default features and builds
# its own binary with `bootstrap`. `local-identity` compiles in
# `ZUPFLOW_IDENTITY=local` (every Console request is the built-in owner);
# without it, that value stops startup.
[features]
default = ["sqlite", "local-identity"]
sqlite = ["dep:zupflow-sqlite"]
local-identity = ["zupflow-basic/local-identity"]

[dependencies]
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded = "0.7"
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
regex = "1"
url = "2"
zeroize.workspace = true
zupflow-basic.workspace = true
zupflow-channels.workspace = true
zupflow-core.workspace = true
zupflow-mcp.workspace = true
zupflow-oidc.workspace = true
zupflow-outbound.workspace = true
zupflow-providers.workspace = true
zupflow-slack.workspace = true
zupflow-sqlite = { workspace = true, optional = true }

[dev-dependencies]
zupflow-basic = { workspace = true, features = ["local-identity"] }
zupflow-providers = { workspace = true, features = ["fake"] }
zupflow-slack = { workspace = true, features = ["fake"] }
zupflow-sqlite.workspace = true
aws-lc-rs.workspace = true
jsonwebtoken.workspace = true
http-body-util.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled"] }
tower.workspace = true
