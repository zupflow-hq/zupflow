[package]
name = "zupflow-sqlite"
description = "Zupflow's basic database: SQLite, with its migrations, the domain stores and the database-backed job queue."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
getrandom.workspace = true
serde_json.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite-bundled", "uuid"] }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
zupflow-core.workspace = true

[dev-dependencies]
zupflow-conformance.workspace = true
