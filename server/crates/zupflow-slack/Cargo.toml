[package]
name = "zupflow-slack"
description = "Slack for agent channels: the configuration-token app provisioner, the Events API reader and the Web API calls, all through the safe outbound path."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# `fake` builds `fake::FakeSlack`, an in-process stand-in for Slack's Web API
# that tests reach through `OutboundHttp`. Test-only: only dev-dependencies
# turn it on.
[features]
fake = ["dep:tokio"]

[dependencies]
async-trait.workspace = true
base64.workspace = true
hmac.workspace = true
serde_json.workspace = true
serde_urlencoded = "0.7"
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }
tracing.workspace = true
url = "2"
zeroize.workspace = true
zupflow-core.workspace = true

[dev-dependencies]
tokio.workspace = true
