[package]
name = "zupflow-basic"
description = "The basic implementations of Zupflow's external-resource traits: they run anywhere, with no account or extra service."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# `local-identity`: `LocalIdentity`, Console sign-in that makes every request
# the built-in owner, for one person on their own machine. Off unless a crate
# asks for it, so a deployment can't select what it doesn't contain.
# `scripted-channels`: `ScriptedChannelProvisioner`, which makes channel apps
# by fixed rules and calls no provider. Only tests and the development-only
# contract server turn it on: no deployment's build registers it.
[features]
local-identity = []
scripted-channels = []

[dependencies]
async-trait.workspace = true
base64.workspace = true
getrandom.workspace = true
hmac.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
zeroize.workspace = true
zupflow-core.workspace = true

[dev-dependencies]
zupflow-conformance.workspace = true
