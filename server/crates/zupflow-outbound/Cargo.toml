[package]
name = "zupflow-outbound"
description = "The safe outbound HTTP path: HTTPS to public addresses only, checked after DNS resolution, no redirects, bounded in size and time."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Development only: `SafeHttpClient::for_local_apps`, for the contract server
# to reach a local fake app (Taskboard). Off by default; only
# `zupflow-contract`'s own opt-in `local-apps` feature turns it on, and CI
# fails if `zupflow-server`'s tree has it. Also refuses to build without
# debug assertions.
local-apps = []

[dependencies]
async-trait.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tokio.workspace = true
tracing.workspace = true
zupflow-core.workspace = true

[dev-dependencies]
axum.workspace = true
futures-util = "0.3"
zupflow-conformance.workspace = true
zeroize.workspace = true
