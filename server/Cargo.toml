# The Zupflow backend: one deployable service, organized by domain.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"

[workspace.dependencies]
# `zeroize` wipes the AES key schedules and GHASH keys after use; the OS RNG comes from getrandom directly.
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "zeroize"] }
async-trait = "0.1"
# Test-only key generation for the OIDC tests; production crypto goes through jsonwebtoken and rustls.
aws-lc-rs = { version = "1", features = ["ring-io"] }
axum = "0.8"
base64 = "0.23"
getrandom = "0.4"
# API keys are stored as HMAC-SHA256 under a server key.
hmac = "0.13"
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
zeroize = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v7"] }
zupflow-basic = { path = "crates/zupflow-basic" }
zupflow-conformance = { path = "crates/zupflow-conformance" }
zupflow-core = { path = "crates/zupflow-core" }
zupflow-oidc = { path = "crates/zupflow-oidc" }
zupflow-outbound = { path = "crates/zupflow-outbound" }
zupflow-sqlite = { path = "crates/zupflow-sqlite" }

# Test-only
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
